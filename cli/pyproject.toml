[project]
name = "boiai-cli"
version = "0.1.0"
description = "CLI do BoiAI — chat com o agente, banco de dados e importações"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7", "httpx>=0.27", "pymysql>=1.1"]

[project.scripts]
boiai = "boiai_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
